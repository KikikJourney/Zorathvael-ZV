name: On-chain mint verification

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

concurrency:
  group: onchain-verification
  cancel-in-progress: true

jobs:
  verify-mint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query Solana mainnet RPC (read-only)
        run: python scripts/verify_onchain.py
      - name: Verify indexed token metadata with Solscan Pro API (read-only)
        env:
          SOLSCAN_API_KEY: ${{ secrets.SOLSCAN_API_KEY }}
        run: python scripts/verify_solscan_api.py
